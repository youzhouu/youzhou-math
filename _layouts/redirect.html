<!doctype html>
<html lang="{{ site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page moved · {{ site.title | escape }}</title>
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <p>This page has moved. <a href="{{ page.redirect_to | relative_url }}">Continue to the new page</a>.</p>
  </body>
</html>
